# The package's own strict config, one level up: an example is code the reader
# copies, so it answers to the same rules as `lib/`.
#
# The `analyzer: exclude:` list repeats the one that comes down with the
# include. Newer Flutter (3.47) writes this block into an app's own file on
# `flutter pub get` when it is missing there, so keeping it here keeps the tree
# clean on both legs of CI.
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: ../analysis_options.yaml

linter:
  rules:
    # Off for an example: an example app exports no API to document, its
    # one-line widget methods read better as blocks, and a fire-and-forget
    # call is the demo itself rather than a forgotten `await`.
    public_member_api_docs: false
    prefer_expression_function_bodies: false
    discarded_futures: false
