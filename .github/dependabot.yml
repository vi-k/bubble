version: 2

updates:
  # The workflow pins actions to commit SHAs, so without this the pins never
  # move. Dependabot moves the pin and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # Without this, nothing watches the package's Dart dependencies at all.
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: monthly
    ignore:
      # flutter_lints 6 needs a newer SDK than the ^3.6.0 floor, so the floor
      # leg of CI could not resolve it. Drop this entry the day the floor
      # moves (which also means dropping require_trailing_commas, see
      # analysis_options.yaml).
      - dependency-name: flutter_lints
        update-types: [version-update:semver-major]

  # No entry for /example, on purpose. Dependabot resolves on the newest
  # Flutter that the example's environment allows and rewrites the whole
  # lockfile there, while the committed lockfile is the one the floor
  # resolves (see the last step of ci.yml). Every update it could open would
  # fail the floor leg, so the example's dependencies move by hand, when the
  # floor moves.
